server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Coolify terminates TLS upstream; keep logs lean and honour forwarded proto.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;

  # Hashed build assets are immutable and safe to cache hard.
  location /assets/ {
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The service worker must never be cached, otherwise clients get stuck on an
  # old build and never receive the update prompt.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
    try_files $uri =404;
  }

  # Workbox runtime chunk is content-hashed but referenced by sw.js — revalidate.
  location ~ ^/workbox-[^/]+\.js$ {
    add_header Cache-Control "no-cache";
    expires off;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }

  # Icons and favicon: cache, but allow revalidation.
  location ~* \.(png|ico|svg)$ {
    expires off;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # SPA fallback — everything else resolves to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
